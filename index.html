<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="遊戲計時器">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)">
    <title>遊戲計時器</title>
    <link rel="stylesheet" href="css/app.css?v=36">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div class="timer-entry-gate" id="timerEntryGate" role="dialog" aria-modal="true" aria-labelledby="timerEntryGateTitle" aria-hidden="true">
        <div class="timer-entry-gate-inner">
            <h1 class="timer-entry-gate-title" id="timerEntryGateTitle"></h1>
            <div class="timer-entry-gate-actions">
                <button type="button" class="timer-entry-gate-btn timer-entry-gate-btn--home btn-press-3d" id="timerEntryHomeBtn" onclick="enterTimerFromGate('home')"></button>
                <button type="button" class="timer-entry-gate-btn timer-entry-gate-btn--new btn-press-3d" id="timerEntryNewBtn" onclick="enterTimerFromGate('new')"></button>
            </div>
        </div>
    </div>

    <div class="timer-wizard" id="timerWizard" role="dialog" aria-modal="true" aria-labelledby="timerWizardTitle" aria-hidden="true">
        <div class="timer-wizard-card">
            <div class="timer-wizard-header">
                <button type="button" class="timer-wizard-back" id="timerWizardBackBtn" onclick="timerWizardBack()" hidden aria-label="">&lsaquo;</button>
                <div class="timer-wizard-progress" id="timerWizardProgress" aria-hidden="true"></div>
                <button type="button" class="timer-wizard-close" id="timerWizardCloseBtn" onclick="closeTimerWizard()" aria-label="">&times;</button>
            </div>
            <p class="timer-wizard-step-label" id="timerWizardStepLabel"></p>
            <h2 class="timer-wizard-title" id="timerWizardTitle"></h2>
            <div class="timer-wizard-body" id="timerWizardBody"></div>
            <div class="timer-wizard-footer">
                <button type="button" class="timer-wizard-action btn-main" id="timerWizardActionBtn" onclick="timerWizardAction()"></button>
            </div>
        </div>
    </div>

    <div class="panel-overlay" id="panelOverlay" onclick="closeSidePanel()"></div>
    <div class="start-sheet-overlay" id="startSheetOverlay" onclick="closeStartSheet()"></div>
    <div class="start-sheet" id="startSheet" role="dialog" aria-modal="true" aria-labelledby="startSheetTitle">
        <div class="start-sheet-handle" aria-hidden="true"></div>
        <div class="start-sheet-header">
            <h2 class="start-sheet-title" id="startSheetTitle"></h2>
            <button type="button" class="start-sheet-close" id="startSheetCloseBtn" onclick="closeStartSheet()" aria-label="">&times;</button>
        </div>
        <div class="start-sheet-body" id="startSheetBody"></div>
    </div>
    <div id="startContentHolder" hidden aria-hidden="true"></div>

    <div class="control-panel" id="sidePanel">
        <button type="button" class="panel-close-bar" id="panelCloseBar" onclick="closeSidePanel()"></button>
        <div class="control-panel-inner" id="sidePanelContent"></div>
    </div>
    <div class="main-column">
        <div class="pull-refresh-indicator" id="pullRefreshIndicator" aria-hidden="true">
            <span class="pull-refresh-spinner" id="pullRefreshSpinner" aria-hidden="true"></span>
            <span class="pull-refresh-text" id="pullRefreshText">下拉更新</span>
        </div>
        <div class="notify-enable-banner" id="notifyEnableBanner" hidden>
            <div class="notify-enable-banner-head">
                <strong id="notifyEnableBannerTitle">請開啟到點通知</strong>
                <button type="button" class="notify-enable-banner-dismiss btn-press-3d" id="notifyEnableBannerDismiss" data-notify-dismiss aria-label="關閉">&times;</button>
            </div>
            <p id="notifyEnableBannerBody">按下方按鈕並在系統視窗選「允許」。</p>
            <button type="button" class="notify-permission-btn notify-permission-btn--block btn-press-3d" id="notifyEnableBannerBtn" onclick="requestNotificationPermissionExplicit()">允許通知</button>
        </div>
        <div class="main-toolbar" id="mainTimerDisplayBar"></div>
        <div class="main-body">
            <div id="mainDisplay"></div>
        </div>
    </div>

    <div id="undoToast" class="undo-toast">
        <div class="undo-btn-text" onclick="undoAction()" id="undoText"></div>
        <span onclick="dismissUndo()" style="margin-left:10px; cursor:pointer; font-weight: bold;">&times;</span>
    </div>

    <div class="onboarding-tour" id="onboardingTour" aria-hidden="true">
        <div class="onboarding-spot" id="onboardingSpot" aria-hidden="true"></div>
        <div class="onboarding-card" id="onboardingCard" role="dialog" aria-modal="true" aria-labelledby="onboardingTitle">
            <p class="onboarding-step-label" id="onboardingStepLabel"></p>
            <h2 class="onboarding-title" id="onboardingTitle"></h2>
            <p class="onboarding-body" id="onboardingBody"></p>
            <p class="onboarding-hint onboarding-hint--warn" id="onboardingHint" hidden></p>
            <div class="onboarding-actions">
                <button type="button" class="onboarding-skip" id="onboardingSkipBtn" onclick="skipInteractiveTutorial()"></button>
                <button type="button" class="onboarding-next" id="onboardingNextBtn" onclick="advanceInteractiveTutorial()"></button>
            </div>
        </div>
    </div>

    <div class="tutorial-modal" id="tutorialModal" role="dialog" aria-modal="true" aria-labelledby="tutorialModalTitle" onclick="if(event.target===this)closeTutorialModal()">
        <div class="tutorial-modal-card" onclick="event.stopPropagation()">
            <div class="tutorial-modal-header">
                <h2 class="tutorial-modal-title" id="tutorialModalTitle"></h2>
                <button type="button" class="tutorial-modal-close" onclick="closeTutorialModal()" aria-label="">&times;</button>
            </div>
            <div class="tutorial-modal-body" id="tutorialModalBody"></div>
        </div>
    </div>

    <script src="js/app.js?v=45"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)">
    <title>遊戲計時器</title>
    <link rel="stylesheet" href="css/app.css?v=7">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div class="panel-overlay" id="panelOverlay" onclick="closeSidePanel()"></div>
    <div class="start-sheet-overlay" id="startSheetOverlay" onclick="closeStartSheet()"></div>
    <div class="start-sheet" id="startSheet" role="dialog" aria-modal="true" aria-labelledby="startSheetTitle">
        <div class="start-sheet-handle" aria-hidden="true"></div>
        <div class="start-sheet-header">
            <h2 class="start-sheet-title" id="startSheetTitle"></h2>
            <button type="button" class="start-sheet-close" id="startSheetCloseBtn" onclick="closeStartSheet()" aria-label="">&times;</button>
        </div>
        <div class="start-sheet-body" id="startSheetBody"></div>
    </div>
    <div id="startContentHolder" hidden aria-hidden="true"></div>

    <div class="control-panel" id="sidePanel">
        <button type="button" class="panel-close-bar" id="panelCloseBar" onclick="closeSidePanel()"></button>
        <div class="control-panel-inner" id="sidePanelContent"></div>
    </div>
    <div class="main-column">
        <div class="main-toolbar" id="mainTimerDisplayBar"></div>
        <div class="main-body">
            <div id="mainDisplay"></div>
        </div>
    </div>

    <div id="undoToast" class="undo-toast">
        <div class="undo-btn-text" onclick="undoAction()" id="undoText"></div>
        <span onclick="dismissUndo()" style="margin-left:10px; cursor:pointer; font-weight: bold;">&times;</span>
    </div>

    <div class="onboarding-tour" id="onboardingTour" aria-hidden="true">
        <div class="onboarding-spot" id="onboardingSpot" aria-hidden="true"></div>
        <div class="onboarding-card" id="onboardingCard" role="dialog" aria-modal="true" aria-labelledby="onboardingTitle">
            <p class="onboarding-step-label" id="onboardingStepLabel"></p>
            <h2 class="onboarding-title" id="onboardingTitle"></h2>
            <p class="onboarding-body" id="onboardingBody"></p>
            <p class="onboarding-hint onboarding-hint--warn" id="onboardingHint" hidden></p>
            <div class="onboarding-actions">
                <button type="button" class="onboarding-skip" id="onboardingSkipBtn" onclick="skipInteractiveTutorial()"></button>
                <button type="button" class="onboarding-next" id="onboardingNextBtn" onclick="advanceInteractiveTutorial()"></button>
            </div>
        </div>
    </div>

    <div class="tutorial-modal" id="tutorialModal" role="dialog" aria-modal="true" aria-labelledby="tutorialModalTitle" onclick="if(event.target===this)closeTutorialModal()">
        <div class="tutorial-modal-card" onclick="event.stopPropagation()">
            <div class="tutorial-modal-header">
                <h2 class="tutorial-modal-title" id="tutorialModalTitle"></h2>
                <button type="button" class="tutorial-modal-close" onclick="closeTutorialModal()" aria-label="">&times;</button>
            </div>
            <div class="tutorial-modal-body" id="tutorialModalBody"></div>
        </div>
    </div>

    <script src="js/app.js?v=6"></script>
</body>
</html>
